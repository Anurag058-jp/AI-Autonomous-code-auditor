[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-cost-code-auditor"
version = "0.1.0"
description = "Local-first AST, RAG, and LLM code security auditor"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "typer>=0.12", "pydantic>=2.8",
  "pydantic-settings>=2.3", "python-dotenv>=1.0", "httpx>=0.27", "pathspec>=0.12",
  "chromadb>=0.5", "sentence-transformers>=3.0", "tree-sitter>=0.23", "streamlit>=1.37"
]

[project.optional-dependencies]
treesitter = ["tree-sitter-language-pack>=0.5"]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.0", "pyinstaller>=6.0"]

[project.scripts]
audit = "auditor.cli:app"
audit-api = "auditor.api:run"
audit-dashboard = "auditor.dashboard:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
